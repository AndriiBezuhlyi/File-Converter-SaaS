name: Set up Flux tooling
description: Use the approved Node line and pinned npm for installation and subsequent commands
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version-file: .nvmrc
        cache: npm
        cache-dependency-path: package-lock.json
    - name: Install pinned npm without modifying the runner globally
      shell: bash
      run: |
        npm install --prefix "$RUNNER_TEMP/flux-npm" --no-save --ignore-scripts --no-audit --no-fund "$(node -p 'require("./package.json").packageManager')"
        echo "$RUNNER_TEMP/flux-npm/node_modules/.bin" >> "$GITHUB_PATH"
    - name: Verify npm pin and install locked dependencies
      shell: bash
      run: |
        test "$(npm --version)" = "$(node -p 'require("./package.json").packageManager.split("@")[1]')"
        npm ci --no-audit --no-fund
