name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node scripts/playwright.mjs install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run infra:config
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [api, worker, proxy, minio]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: docker build -f infra/docker/${{ matrix.target }}.Dockerfile .
