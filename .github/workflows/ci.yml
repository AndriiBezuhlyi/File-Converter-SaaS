name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node scripts/playwright.mjs install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run infra:config
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: converter_test
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: converter_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U converter_test -d converter_test"
          --health-interval=5s --health-timeout=3s --health-retries=20
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=20
    env:
      TEST_DATABASE_URL: postgresql://converter_test:local-test-only@127.0.0.1:5432/converter_test
      TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run db:migrate:deploy --workspace=@converter/backend
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - run: npm run test:database
      - run: npm run test:infrastructure
      - run: npm run test:auth
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [api, worker, proxy, minio]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: docker build -f infra/docker/${{ matrix.target }}.Dockerfile .
