# Disposable CI only. No .env, external volumes, production endpoints or credentials.
x-runtime: &runtime
  NODE_ENV: test
  DATABASE_URL: postgresql://converter_test:local-test-only@postgres:5432/converter_test_ci
  REDIS_URL: redis://redis:6379
  REDIS_NAMESPACE: flux-ci
  S3_ENDPOINT: http://minio:9000
  S3_REGION: us-east-1
  S3_BUCKET: flux-ci
  S3_ACCESS_KEY_ID: ci-synthetic-storage
  S3_SECRET_ACCESS_KEY: ci-synthetic-storage-only
  S3_FORCE_PATH_STYLE: 'true'
  SMTP_HOST: mailpit
  SMTP_PORT: '1025'
  SMTP_FROM: converter@example.test
  SMTP_SECURE: 'false'
  SMTP_REQUIRE_TLS: 'false'
  APP_ORIGIN: http://127.0.0.1:5173
  SESSION_SECRET: ${CI_SESSION_SECRET:?Generated by the CI harness}
  NOTIFICATION_ENCRYPTION_KEY: ${CI_NOTIFICATION_KEY:?Generated by the CI harness}
  WORKER_TEMP_DIR: /tmp/converter
x-bounded: &bounded
  init: true
  read_only: true
  tmpfs: ['/tmp:rw,nosuid,nodev,size=256m,mode=1777']
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true', 'seccomp=./security/worker-seccomp.json']
  cpus: '1.0'
  mem_limit: 1g
  pids_limit: 128
  stop_grace_period: 30s
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: converter_test
      POSTGRES_PASSWORD: local-test-only
      POSTGRES_DB: converter_test_ci
    ports: ['127.0.0.1:55432:5432']
    tmpfs: ['/var/lib/postgresql:rw,size=512m']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U converter_test -d converter_test_ci']
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:8-alpine
    command:
      ['redis-server', '--save', '', '--appendonly', 'no', '--maxmemory-policy', 'noeviction']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30
  minio:
    image: flux-ci-minio:local
    environment:
      MINIO_ROOT_USER: ci-synthetic-storage
      MINIO_ROOT_PASSWORD: ci-synthetic-storage-only
    tmpfs: ['/data:rw,size=512m,mode=1777']
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://127.0.0.1:9000/minio/health/live']
      interval: 2s
      timeout: 3s
      retries: 30
  minio-init:
    image: flux-ci-minio:local
    entrypoint: ['/bin/sh', '-ec']
    command:
      - |
        mc alias set ci http://minio:9000 ci-synthetic-storage ci-synthetic-storage-only
        mc mb ci/flux-ci
        mc anonymous set none ci/flux-ci
    depends_on:
      minio: { condition: service_healthy }
  mailpit:
    image: axllent/mailpit:v1.31
    ports: ['127.0.0.1:58025:8025']
  api:
    <<: *bounded
    image: flux-ci-api:local
    environment:
      <<: *runtime
      API_HOST: 0.0.0.0
      API_PORT: '3000'
    ports: ['127.0.0.1:3000:3000']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
      mailpit: { condition: service_started }
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/v1/health/ready',{signal:AbortSignal.timeout(7000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 8s
      retries: 20
      start_period: 30s
  worker:
    <<: *bounded
    image: flux-ci-worker:local
    environment: *runtime
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'node', 'dist/worker/infrastructure/health/worker-probe.js']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
