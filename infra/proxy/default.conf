log_format safe_access '$request_method $uri $status $body_bytes_sent';
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 21m;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    access_log /var/log/nginx/access.log safe_access;

    # Enable only in public static locations; API/auth/download responses stay excluded.
    gzip off;
    gzip_comp_level 5;
    gzip_min_length 1024;
    # Static locations set Vary explicitly, including 304 responses skipped by gzip's filter.
    gzip_vary off;
    gzip_types text/css text/plain text/javascript application/javascript application/json
               application/xml text/xml image/svg+xml application/manifest+json;

    location /api/ {
        gzip off;
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # This production proxy is reachable only through the deployment's HTTPS ingress.
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off;
        proxy_read_timeout 60s;
    }
    location /assets/ {
        gzip on;
        # Static responses remain eligible behind the deployment's HTTPS ingress (Via).
        gzip_proxied any;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Vary Accept-Encoding always;
        add_header Referrer-Policy no-referrer always;
    }
    location / {
        gzip on;
        gzip_proxied any;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header Vary Accept-Encoding always;
        add_header Referrer-Policy no-referrer always;
    }
}
