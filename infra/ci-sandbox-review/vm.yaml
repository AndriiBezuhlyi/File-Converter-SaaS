# Review specification; the separate manual workflow remains approval-gated.
review_only: true
provisioning_approved: false
machine:
  provider: GitHub_hosted_standard_public_repository_runner
  os: Ubuntu Server 24.04 LTS amd64
  image: ubuntu-24.04_record_actual_runner_image_version
  vcpus: 4
  memory_gib: 16
  disposable_disk_gib: 14
  maximum_lifetime_minutes: 30
  management: GitHub_job_lifecycle_no_self_hosted_registration
  credentials: read_only_GITHUB_TOKEN_on_controller_never_passed_to_worker
  kernel:
    cgroup: v2
    apparmor: enforcing
    unprivileged_userns: required_without_sysctl_changes
  tools:
    docker: hosted_engine_record_actual_version
    apparmor_parser: distribution_package
registration:
  github_runner: platform_managed
  persistent_runner: false
dispatch:
  controller: GitHub-hosted
  trigger: workflow_dispatch_only_owner_and_explicit_approval_inputs
  source: maintainer_reviewed_commit_sha
  pull_requests: never
  transport: checkout_exact_dispatch_SHA_and_verify_approved_profile_SHA256
  checkout_credentials_on_vm: false
worker:
  image: flux-ci-worker:experiment
  user: '1000:1000'
  init: true
  read_only: true
  network: none
  cpus: 1
  memory: 1g
  pids_limit: 128
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
    - seccomp=infra/security/worker-seccomp.json
    - apparmor=flux-ci-bwrap-review
  tmpfs: ['/tmp:rw,nosuid,nodev,size=256m,mode=1777']
  test_mount: /app/apps/backend/test:readonly
  command:
    - node
    - --test
    - --test-concurrency=1
    - test/conversion-engine.linux.mjs
    - test/engine-crash.linux.mjs
cleanup:
  workflow_always: remove_label_scoped_containers_and_only_owned_named_profile
  platform_boundary: GitHub_disposes_job_VM_including_on_timeout
  retained: sanitized_native_workflow_logs_no_uploaded_artifacts
  success_requires: all_probes_and_four_original_tests_pass_zero_skips_and_cleanup_passes
