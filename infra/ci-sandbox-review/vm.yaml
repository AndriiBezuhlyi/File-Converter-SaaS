# Review specification only: not cloud-init, Terraform or an active workflow.
review_only: true
provisioning_approved: false
machine:
  os: Ubuntu Server 24.04 LTS amd64
  image: UNSELECTED_REQUIRE_IMMUTABLE_PROVIDER_IMAGE_ID
  vcpus: 2
  memory_gib: 8
  disposable_disk_gib: 30
  maximum_lifetime_minutes: 30
  automatic_shutdown_minutes: 25
  public_inbound: none
  management: provider_private_management_channel
  credentials: no_instance_role_no_repository_token_no_production_secrets
  kernel:
    cgroup: v2
    apparmor: enforcing
    unprivileged_userns: required_without_sysctl_changes
  tools:
    docker: rootful_engine_version_pinned_after_provider_selection
    apparmor_parser: distribution_package
registration:
  github_runner: false
  persistent_runner: false
dispatch:
  controller: GitHub-hosted
  trigger: manual_only_with_protected_environment_approval
  source: maintainer_reviewed_commit_sha
  pull_requests: never
  transport: reviewed_worker_image_and_test_archive_with_verified_sha256
  checkout_credentials_on_vm: false
worker:
  image: flux-ci-worker:local
  user: '1000:1000'
  init: true
  read_only: true
  network: none
  cpus: 1
  memory: 1g
  pids_limit: 128
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
    - seccomp=infra/security/worker-seccomp.json
    - apparmor=flux-ci-bwrap-review
  tmpfs: ['/tmp:rw,nosuid,nodev,size=256m,mode=1777']
  test_mount: /app/apps/backend/test:readonly
  command:
    - node
    - --test
    - --test-concurrency=1
    - test/conversion-engine.linux.mjs
    - test/engine-crash.linux.mjs
cleanup:
  controller_finally: destroy_vm_disks_interfaces_and_temporary_firewall_rules
  independent_watchdog: destroy_by_provider_resource_id_at_30_minutes
  failure_or_cancellation: same_destruction_required
  retained: sanitized_test_results_and_security_metadata_only
  success_requires: all_tests_pass_and_provider_confirms_resource_destruction
